[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  VITE_API_ENDPOINT = "/.netlify/functions/generate"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
